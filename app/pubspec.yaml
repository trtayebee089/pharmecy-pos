name: redpharmabd_app
description: "RedPharmaBD: Your trusted online pharmacy app for ordering medicines, health products, and wellness essentials with convenience and reliability."

publish_to: 'none'

version: 1.0.4+9

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.2.0
  animated_splash_screen: ^1.3.0
  cupertino_icons: ^1.0.8
  http: ^1.1.0
  font_awesome_flutter: ^11.0.0
  provider: ^6.0.5
  flutter_slidable: ^3.1.0
  image_picker: ^1.2.1
  shared_preferences: ^2.5.4
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  lottie: ^3.1.0
  flutter_staggered_grid_view: ^0.6.2
  flutter_typeahead: ^5.1.0
  package_info_plus: ^4.0.0
  google_maps_flutter: ^2.12.0
  geolocator: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.10.0


  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/guest-user.png
    - assets/images/redpharma-icon.png
    - assets/images/App-icon.png
    - assets/images/banners/
    
flutter_icons:
  android: true
  # ios: false
  image_path: "assets/images/redpharma-icon.png"
  adaptive_icon_background: "#ffffff"
  # adaptive_icon_foreground: "assets/images/redpharma-icon.png"
